services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomly}
      POSTGRES_DB: ${POSTGRES_DB:-roomly}
    volumes:
      - roomly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-roomly} -d ${POSTGRES_DB:-roomly}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - roomly-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomly}:${POSTGRES_PASSWORD:-roomly}@postgres:5432/${POSTGRES_DB:-roomly}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-Europe/Kyiv}
      WEB_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:3000}
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES:-10}
      REDIS_URL: redis://redis:6379
      EMAIL_VERIFICATION_EXPIRES_HOURS: ${EMAIL_VERIFICATION_EXPIRES_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      ['sh', '-c', 'npm run db:migrate && npm run db:seed && npm run start --workspace=apps/api']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4000/api/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomly}:${POSTGRES_PASSWORD:-roomly}@postgres:5432/${POSTGRES_DB:-roomly}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-Europe/Kyiv}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@roomly.local}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-5}
      EMAIL_VERIFICATION_EXPIRES_HOURS: ${EMAIL_VERIFICATION_EXPIRES_HOURS:-24}
    depends_on:
      redis:
        condition: service_healthy
    command: ['node', 'apps/api/dist/worker.js']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ''
        VITE_OFFICE_TIMEZONE: ${VITE_OFFICE_TIMEZONE:-Europe/Kyiv}
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  roomly-postgres:
  roomly-redis:
